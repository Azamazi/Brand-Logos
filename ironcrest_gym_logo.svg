<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .brand-serif { font-family: 'Georgia', 'Times New Roman', serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="#0F1210"/>

  <!-- Outer thin ring -->
  <circle cx="250" cy="250" r="200" fill="none" stroke="#C9A24B" stroke-width="1.5"/>
  <!-- Inner ring -->
  <circle cx="250" cy="250" r="185" fill="none" stroke="#C9A24B" stroke-width="1"/>

  <!-- Laurel wreath - left side -->
  <g fill="#C9A24B">
    <ellipse cx="105" cy="210" rx="7" ry="16" transform="rotate(-70 105 210)"/>
    <ellipse cx="100" cy="235" rx="7" ry="17" transform="rotate(-85 100 235)"/>
    <ellipse cx="98" cy="262" rx="7" ry="18" transform="rotate(-100 98 262)"/>
    <ellipse cx="100" cy="289" rx="7" ry="18" transform="rotate(-115 100 289)"/>
    <ellipse cx="106" cy="315" rx="7" ry="17" transform="rotate(-130 106 315)"/>
    <ellipse cx="116" cy="339" rx="7" ry="16" transform="rotate(-145 116 339)"/>
    <ellipse cx="130" cy="360" rx="6" ry="15" transform="rotate(-160 130 360)"/>
    <ellipse cx="148" cy="377" rx="6" ry="14" transform="rotate(-175 148 377)"/>
  </g>

  <!-- Laurel wreath - right side (mirrored) -->
  <g fill="#C9A24B">
    <ellipse cx="395" cy="210" rx="7" ry="16" transform="rotate(70 395 210)"/>
    <ellipse cx="400" cy="235" rx="7" ry="17" transform="rotate(85 400 235)"/>
    <ellipse cx="402" cy="262" rx="7" ry="18" transform="rotate(100 402 262)"/>
    <ellipse cx="400" cy="289" rx="7" ry="18" transform="rotate(115 400 289)"/>
    <ellipse cx="394" cy="315" rx="7" ry="17" transform="rotate(130 394 315)"/>
    <ellipse cx="384" cy="339" rx="7" ry="16" transform="rotate(145 384 339)"/>
    <ellipse cx="370" cy="360" rx="6" ry="15" transform="rotate(160 370 360)"/>
    <ellipse cx="352" cy="377" rx="6" ry="14" transform="rotate(175 352 377)"/>
  </g>

  <!-- Top text: IRONCREST -->
  <text x="250" y="150" text-anchor="middle" class="brand-serif" font-size="42" fill="#F2E9D8" letter-spacing="4" font-weight="600">IRONCREST</text>

  <!-- Small divider dots -->
  <circle cx="185" cy="172" r="2" fill="#C9A24B"/>
  <circle cx="250" cy="172" r="2" fill="#C9A24B"/>
  <circle cx="315" cy="172" r="2" fill="#C9A24B"/>

  <!-- Center emblem: barbell icon -->
  <g stroke="#F2E9D8" stroke-width="6" fill="none" stroke-linecap="round">
    <line x1="170" y1="250" x2="330" y2="250"/>
  </g>
  <g fill="#F2E9D8">
    <rect x="150" y="228" width="14" height="44" rx="3"/>
    <rect x="164" y="235" width="10" height="30" rx="2"/>
    <rect x="336" y="228" width="14" height="44" rx="3"/>
    <rect x="326" y="235" width="10" height="30" rx="2"/>
  </g>

  <!-- Small laurel accent under barbell -->
  <path d="M 220 280 Q 250 295 280 280" stroke="#C9A24B" stroke-width="1.5" fill="none"/>

  <!-- Bottom text -->
  <text x="250" y="325" text-anchor="middle" class="brand-serif" font-size="18" fill="#C9A24B" letter-spacing="6">ATHLETIC CLUB</text>

  <!-- Established year -->
  <text x="250" y="350" text-anchor="middle" class="brand-serif" font-size="11" fill="#8A8578" letter-spacing="3">EST. MMXXIV</text>
</svg>
